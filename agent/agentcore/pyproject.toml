#
# Standalone manifest for agentcore, the domain-agnostic agent harness.
#
# agentcore currently ships nested under the blender-mcp `agent/` tree and is
# built/installed as part of `blender-mcp-agent` (see ../pyproject.toml, which
# bundles both blagent and agentcore). The parent build reads only that file;
# this one is inert there. It exists so agentcore is spin-out ready: it can be
# installed on its own (`pip install ./agent/agentcore`) or lifted into its own
# repository with its packaging already in place. The `package-dir` mapping
# below packages THIS directory as the `agentcore` package.

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore"
version = "0.1.0"
description = "Domain-agnostic agent harness: tool backends, autonomy/orchestrator/swarm, web shell — transport- and domain-blind."
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dependencies = [
    # Starlette >= 1.2.1: includes the fix for the 2026 RCE advisory.
    "starlette>=1.2.1",
    "httpx>=0.27",
    "pyyaml>=6",
]

[tool.setuptools]
# Package this directory as `agentcore` (the dir is the package root).
packages = ["agentcore"]
package-dir = { "agentcore" = "." }

[tool.setuptools.package-data]
"agentcore" = [
    "data/permissions.yaml",
    "web/**/*",
]
