# Tool RBAC — role → tool permissions matrix (see blagent/permissions.py).
#
# Deployed with the app and overridable per deployment (point
# BLENDER_AGENT_PERMISSIONS at another file). Each (role, tool) resolves to a
# LEVEL:
#   allow      call freely
#   elicit     offered, but the harness confirms with the user before running
#   disabled   hidden from the role (not in its registry)
#
# A level may be set per tool (exact name or shell wildcard), per tool GROUP
# (tools declare a `group`), or as the role `default`. Most specific wins:
# exact tool > wildcard tool > group > role default > allow. Unknown roles
# inherit `default`. Roles are matched by string, so new roles can be added
# here without code changes (start set: orchestrator, worker, reviewer,
# auditor; `default` is the catch-all interactive agent).
roles:
  default:
    default: allow

  # Drives objectives by delegating to workers. Full surface, but changing
  # autonomy is confirmed with the user.
  orchestrator:
    default: allow
    tools:
      set_autonomy: elicit

  # Autonomous sub-agent executing one delegated task. No user to ask and no
  # authority over its own autonomy, so those meta-tools are hidden.
  worker:
    default: allow
    tools:
      set_autonomy: disabled
      ask_user: disabled

  # Decomposes a goal / objectives into worker tasks (the draft step +
  # LlmPlanner). A pure LLM call — no tools.
  planner:
    default: disabled

  # Context-blind budget adjudicator (reviewer.py): judges text, runs no tools.
  reviewer:
    default: disabled

  # Dedicated per-worker QA reviewer (opt-in): reviews each worker's proof
  # against the actual scene before the next worker runs. Read-only probes
  # only — judges evidence, not the worker's narrative.
  # Covers both legacy get_*/*summary* tools and the verb-dispatched core tools
  # (scene/blendfile/capture/docs) so the allow-list survives the tool collapse.
  qa:
    default: disabled
    tools:
      "get_*": allow
      "*summary*": allow
      "*diagnostics*": allow
      scene: allow
      blendfile: allow
      capture: allow
      docs: allow
      skills: allow
      media_io: allow

  # Independent verifier (no shared context): read-only state probes only.
  # `default: disabled` with an allow-list means everything else is hidden.
  auditor:
    default: disabled
    tools:
      "get_*": allow
      "*summary*": allow
      "*diagnostics*": allow
      scene: allow
      blendfile: allow
      capture: allow
      docs: allow
      skills: allow
      media_io: allow

  # Example of group-level control (tools declare a `group`); uncomment and
  # adapt once tool groups are assigned:
  # reviewer:
  #   default: disabled
  #   groups:
  #     read-only: allow
  #     destructive: disabled
