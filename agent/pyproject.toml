[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-mcp-agent"
version = "0.1.0"
description = "Web-based agent harness for Blender, built on the blender-mcp tools"
requires-python = ">=3.10"
dependencies = [
    "blender-mcp>=1.0.0",
    # Starlette >= 1.2.1 required: includes the fix for the 2026 RCE advisory.
    "starlette>=1.2.1",
    "uvicorn>=0.30",
    "websockets>=12",
    "httpx>=0.27",
    # ACP: the official SDK supplies the v1 surface and the version-agnostic
    # JSON-RPC Connection. The v2 draft models are generated from the vendored
    # schema (see agentcore/acp/schema/regen.py) -- the SDK is v1-only.
    "agent-client-protocol>=0.12.1",
    "pydantic>=2.7",
]

[project.scripts]
blender-agent = "blagent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["blagent*", "agentcore*"]

[tool.setuptools.package-data]
"blagent" = [
    "data/system_prompt.md",
    "web/**/*",
]
"agentcore" = [
    "data/permissions.yaml",
    "web/**/*",
    # Pinned ACP v2 draft schema: shipped so a deployed agent can validate its
    # own payloads, and so the pin is auditable without the source tree.
    "acp/schema/*.json",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "mcp", "mcp.*",
    "blmcp", "blmcp.*",
    "uvicorn", "uvicorn.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.pylint.format]
max-line-length = 120
